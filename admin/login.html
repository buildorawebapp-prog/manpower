<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Go Hire Consultancy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=15" />
</head>
<body>
  <div class="admin-login">
    <div class="login-card">
      <a href="../index.html" class="brand">
        <span class="brand-logo"></span>
        <span>Go Hire Consultancy<small>Admin Panel</small></span>
      </a>
      <p class="sub">Sign in to manage applications & settings</p>

      <form id="loginForm" novalidate onsubmit="return false">
        <div class="field">
          <label>Email</label>
          <input type="email" id="admEmail" required placeholder="admin@gohireconsultancy.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="admPass" required placeholder="••••••••" />
        </div>
        <button class="btn btn-primary btn-lg btn-block" id="loginBtn" onclick="doLogin()">Sign In</button>
        <p id="loginErr" style="color:#e5484d;font-weight:600;font-size:14px;margin-top:14px;text-align:center;display:none"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=3"></script>
  <script>
    const client = initSupabase();

    // If already logged in, skip straight to the dashboard.
    client.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "dashboard.html";
    });

    async function doLogin() {
      const email = document.getElementById("admEmail").value.trim();
      const pass = document.getElementById("admPass").value;
      const errEl = document.getElementById("loginErr");
      const btn = document.getElementById("loginBtn");
      errEl.style.display = "none";

      if (!email || !pass) { errEl.textContent = "Enter email and password."; errEl.style.display = "block"; return; }

      btn.disabled = true; btn.textContent = "Signing in...";
      const { error } = await client.auth.signInWithPassword({ email, password: pass });
      btn.disabled = false; btn.textContent = "Sign In";

      if (error) {
        errEl.textContent = "Wrong email or password.";
        errEl.style.display = "block";
        return;
      }
      window.location.href = "dashboard.html";
    }

    document.getElementById("admPass").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
