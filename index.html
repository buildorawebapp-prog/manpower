<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Hire Consultancy — Skilled Blue-Collar Manpower Supply</title>
  <meta name="description" content="Go Hire Consultancy supplies verified engineers, plumbers, electricians, welders and skilled workers to businesses across India. Apply for work or hire workers fast." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div id="header-slot"></div>

  <!-- HERO BANNER - Full Screen Professional -->
  <section class="hero-banner">
    <div class="hero-banner-bg">
      <img src="images/banner.png" alt="Professional team" />
      <div class="hero-overlay"></div>
    </div>
    <div class="container hero-content">
      <div class="hero-left">
        <h1>
          <span data-i18n="hero.title1"></span><br />
          <span class="hl" data-i18n="hero.title2"></span>
        </h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero-cta">
          <a href="apply.html" class="btn btn-primary btn-lg" data-i18n="hero.cta1"></a>
          <a href="hire.html" class="btn btn-white btn-lg" data-i18n="hero.cta2"></a>
        </div>
        <div class="hero-stats">
          <div><div class="num">5,000+</div><div class="lbl" data-i18n="hero.stat1"></div></div>
          <div><div class="num">12+</div><div class="lbl" data-i18n="hero.stat2"></div></div>
          <div><div class="num">16+</div><div class="lbl" data-i18n="hero.stat3"></div></div>
        </div>
      </div>

    </div>
  </section>

  <!-- TRUST BAR -->
  <div class="trustbar">
    <div class="container">
      <span><span class="dot">●</span> <span data-i18n="trust.1"></span></span>
      <span><span class="dot">●</span> <span data-i18n="trust.2"></span></span>
      <span><span class="dot">●</span> <span data-i18n="trust.3"></span></span>
      <span><span class="dot">●</span> <span data-i18n="trust.4"></span></span>
    </div>
  </div>

  <!-- SERVICES / TRADES -->
  <section class="section" id="services">
    <div class="container">
      <div class="center reveal">
        <span class="eyebrow" data-i18n="services.eyebrow"></span>
        <h2 class="section-title" data-i18n="services.title"></h2>
        <p class="section-sub" data-i18n="services.sub"></p>
      </div>
      <div class="grid grid-4 reveal" id="tradesGrid" style="margin-top:40px"></div>
    </div>
  </section>

  <!-- SPLIT CTA -->
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="split">
        <div class="split-card split-worker with-photo reveal">
          <div class="sp-photo" style="background-image:url('images/worker.jpg')"></div>
          <div class="sp-body">
            <div class="big-ic">👷</div>
            <h3 data-i18n="split.worker.t"></h3>
            <p data-i18n="split.worker.p"></p>
            <a href="apply.html" class="btn btn-primary" data-i18n="split.worker.b"></a>
          </div>
        </div>
        <div class="split-card split-employer with-photo reveal">
          <div class="sp-photo" style="background-image:url('images/cta.jpg')"></div>
          <div class="sp-body">
            <div class="big-ic">🏢</div>
            <h3 data-i18n="split.employer.t"></h3>
            <p data-i18n="split.employer.p"></p>
            <a href="hire.html" class="btn btn-navy" data-i18n="split.employer.b"></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- WHY US -->
  <section class="section" id="why" style="padding-top:0">
    <div class="container">
      <div class="center reveal">
        <span class="eyebrow" data-i18n="why.eyebrow"></span>
        <h2 class="section-title" data-i18n="why.title"></h2>
      </div>
      <div class="grid grid-4 reveal" style="margin-top:40px">
        <div class="feature"><div class="fic">✅</div><h3 data-i18n="why.1t"></h3><p data-i18n="why.1p"></p></div>
        <div class="feature"><div class="fic">⚡</div><h3 data-i18n="why.2t"></h3><p data-i18n="why.2p"></p></div>
        <div class="feature"><div class="fic">🧰</div><h3 data-i18n="why.3t"></h3><p data-i18n="why.3p"></p></div>
        <div class="feature"><div class="fic">📍</div><h3 data-i18n="why.4t"></h3><p data-i18n="why.4p"></p></div>
      </div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="center reveal">
        <span class="eyebrow" data-i18n="how.eyebrow"></span>
        <h2 class="section-title" data-i18n="how.title"></h2>
      </div>
      <div class="steps reveal" style="margin-top:40px">
        <div class="step"><div class="n">1</div><h3 data-i18n="how.1t"></h3><p data-i18n="how.1p"></p></div>
        <div class="step"><div class="n">2</div><h3 data-i18n="how.2t"></h3><p data-i18n="how.2p"></p></div>
        <div class="step"><div class="n">3</div><h3 data-i18n="how.3t"></h3><p data-i18n="how.3p"></p></div>
      </div>
    </div>
  </section>

  <!-- CONTACT BAND -->
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="contact-band with-photo reveal" style="--cta-img:url('/images/cta.jpg')">
        <h2 data-i18n="contact.title"></h2>
        <p data-i18n="contact.sub"></p>
        <div class="contact-actions">
          <a class="btn btn-white btn-lg" data-call href="#">📞 <span data-phone-text></span></a>
          <a class="btn btn-whatsapp btn-lg" data-whatsapp href="#">💬 <span data-i18n="contact.whatsapp"></span></a>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=3"></script>
  <script src="js/i18n.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    function renderTrades() {
      // Full trades grid — photo where available, else icon tile
      document.getElementById("tradesGrid").innerHTML = DEMO_TRADES.map(tr => {
        const img = tradeImage(tr);
        if (img) {
          return `<a href="hire.html" class="trade-card has-photo">
            <div class="thumb" style="background-image:url('${img}')">
              <div class="icon">${tr.icon}</div>
            </div>
            <div class="body">
              <h3>${tr.name}</h3>
              <p>${tr.desc}</p>
              <span class="go" data-i18n="services.go"></span> <span class="go">→</span>
            </div>
          </a>`;
        }
        return `<a href="hire.html" class="trade-card icon-only">
          <div class="thumb icon-thumb"><span class="big-emoji">${tr.icon}</span></div>
          <div class="body">
            <h3>${tr.name}</h3>
            <p>${tr.desc}</p>
            <span class="go" data-i18n="services.go"></span> <span class="go">→</span>
          </div>
        </a>`;
      }).join("");
      applyLang(getLang());
    }

    initShell("index.html");
    renderTrades();
    loadLiveData(renderTrades);
  </script>
</body>
</html>
